[build]
  command = "npm run verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PUBLIC_SITE_URL = "https://lead-unmsm.netlify.app"
  PUBLIC_PROTOTYPE = "true"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
